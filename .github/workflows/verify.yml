name: Verify

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the earlier run's answer irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # tsc resolves types from the generated Prisma client, so this must run
      # before the typecheck. It reads the schema only — no database, and no
      # DATABASE_URL required.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The suites that need a real PostgreSQL database are gated behind
      # EVENT_CORE_INTEGRATION_TEST / PHASE45_INTEGRATION_TEST /
      # BILLING_INTEGRATION_TEST and skip here. Everything else runs with no
      # secrets at all, which is why this job needs none — verified by running
      # the same three steps locally with .env and .env.local removed.
      - name: Unit and contract tests
        run: npm test

      # The build is what makes the bundle budget measurable — the check reads
      # the prerendered HTML that `next build` emits. Verified to succeed with no
      # .env files present, which is the state of this runner: `.env*` is
      # gitignored and this job requests no secrets.
      - name: Build
        run: npm run build

      # Guards against a heavy library reaching a route through a static import.
      # This exists because `@next/bundle-analyzer` is a webpack plugin and emits
      # nothing under Turbopack, so `ANALYZE=true` was silently a no-op and a
      # 875 KB regression sat on the landing page unnoticed.
      - name: Bundle budget
        run: npm run bundle:check

  governed-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: governed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d governed"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:disposable_test_only@127.0.0.1:5432/governed
      DIRECT_URL: postgresql://postgres:disposable_test_only@127.0.0.1:5432/governed
      GOVERNED_INTEGRATION_TEST: 'true'
      PGPASSWORD: disposable_test_only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Prepare disposable database roles and UTC sessions
        run: |
          psql -h 127.0.0.1 -U postgres -d governed -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          psql -h 127.0.0.1 -U postgres -d governed -v ON_ERROR_STOP=1 -c "ALTER DATABASE governed SET timezone TO 'UTC';"
      - run: npx prisma migrate deploy
      - run: npx vitest run src/modules/leads/application/GovernedIntelligence.integration.test.ts
